; The image already drops to a non-root user (USER in docker/php/Dockerfile),
; so the pool's own `user`/`group` directives are omitted: php-fpm ignores them
; unless the master runs as root, and setting them only emits a startup NOTICE.
; File ownership for the bind mount comes from the UID/GID build args instead.
[www]
listen = 9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

; Laravel reads config from the environment, so the pool must not scrub it.
clear_env = no

; Send worker stdout/stderr straight to the container log, undecorated.
catch_workers_output = yes
decorate_workers_output = no
