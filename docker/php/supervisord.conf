[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/tmp/supervisord.log

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:match-consumer]
command=php /var/www/html/artisan rabbitmq:consume rabbitmq --queue=prices.ticks --tries=3 --timeout=30 --max-time=3600 --prefetch-count=1 --sleep=0.1
directory=/var/www/html
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=35
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:drain-consumer]
command=php /var/www/html/artisan rabbitmq:consume rabbitmq --queue=prices.drain --tries=3 --timeout=30 --max-time=3600 --prefetch-count=1 --sleep=0.1
directory=/var/www/html
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=35
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mail-consumer]
command=php /var/www/html/artisan rabbitmq:consume rabbitmq_notifications --queue=notify.mail --tries=2 --timeout=30 --max-time=3600 --prefetch-count=10 --sleep=0.1
directory=/var/www/html
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=35
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
